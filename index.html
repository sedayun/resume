<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경남정보대 및 인근 대학 지도 (마커 + 인포윈도우 + 클러스터러)</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; }
    </style>
</head>
<body>
    <div id="map" style="width:100%;height:100vh;"></div>

    <!-- clusterer 라이브러리 포함 -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=e21559fa27072af635c69adf895294e4&libraries=clusterer"></script>
    <script>
    const LAT = 35.1468209;
    const LNG = 129.0112424;

    var mapContainer = document.getElementById('map'), 
        mapOption = { 
            center: new kakao.maps.LatLng(LAT, LNG), // 지도의 중심좌표 (경남정보대)
            level: 3 // 지도의 확대 레벨
        };

    // 1. 지도 생성
    var map = new kakao.maps.Map(mapContainer, mapOption); 

    // 2. 첫 번째 코드 기능: 기본 파란 마커 및 클릭 시 인포윈도우
    var mainMarkerPosition = new kakao.maps.LatLng(LAT, LNG); 
    var mainMarker = new kakao.maps.Marker({
        position: mainMarkerPosition
    });
    mainMarker.setMap(map);

    var iwContent = '<div style="padding:5px;"><a href="https://www.kit.ac.kr/" target="_blank">경남정보대학교 홈페이지</a></div>';
    var infowindow = new kakao.maps.InfoWindow({
        content : iwContent,
        removable : true
    });

    kakao.maps.event.addListener(mainMarker, 'click', function() {
        infowindow.open(map, mainMarker);
    });

    // 3. 두 번째 & 세 번째 코드 기능: 여러 대학교 별 마커 + 마커 클러스터러
    var positions = [
        {
            title: '경남정보대학교',
            latlng: new kakao.maps.LatLng(LAT, LNG),
            url: 'https://www.kit.ac.kr/'
        },
        {
            title: '동서대학교',
            latlng: new kakao.maps.LatLng(35.1461119, 129.0070218),
            url: 'https://www.dongseo.ac.kr/'
        },
        {
            title: '부산디지털대학교',
            latlng: new kakao.maps.LatLng(35.1463906, 129.0095931),
            url: 'https://www.bdu.ac.kr/'
        },
        {
            title: '신라대학교',
            latlng: new kakao.maps.LatLng(35.16792, 128.9970255),
            url: 'https://www.silla.ac.kr/'
        }
    ];

    var imageSrc = "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png";

    // 마커 클러스터러 생성 (지도 축소 시 레벨 10 이상부터 원형 숫자로 묶임)
    var clusterer = new kakao.maps.MarkerClusterer({
        map: map,
        averageCenter: true,
        minLevel: 10
    });

    var clusterMarkers = [];

    for (var i = 0; i < positions.length; i++) {
        var imageSize = new kakao.maps.Size(24, 35);
        var markerImage = new kakao.maps.MarkerImage(imageSrc, imageSize);

        var starMarker = new kakao.maps.Marker({
            position: positions[i].latlng,
            title: positions[i].title,
            image: markerImage
        });

        // 각 별 마커에도 클릭 시 학교명과 링크 인포윈도우가 열리도록 연결
        (function(marker, data) {
            var subInfowindow = new kakao.maps.InfoWindow({
                content: '<div style="padding:5px;"><b>' + data.title + '</b><br><a href="' + data.url + '" target="_blank">홈페이지 이동</a></div>',
                removable: true
            });

            kakao.maps.event.addListener(marker, 'click', function() {
                subInfowindow.open(map, marker);
            });
        })(starMarker, positions[i]);

        clusterMarkers.push(starMarker);
    }

    // 클러스터러에 4개 대학 마커 일괄 등록
    clusterer.addMarkers(clusterMarkers);
    </script>
</body>
</html>
