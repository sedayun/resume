<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>마커 생성 및 여러개 마커 제어하기</title>
</head>
<body>
<div id="map" style="width:100%;height:350px;"></div>
<p>
    <button onclick="hideMarkers()">마커 감추기</button>
    <button onclick="showMarkers()">마커 보이기</button>
</p> 
<em>클릭한 위치에 마커가 추가로 표시됩니다!</em>
    
<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=5248eec0a8d9ce2bf219062d780be082"></script>
<script>
var mapContainer = document.getElementById('map'), // 지도를 표시할 div  
    mapOption = { 
        center: new kakao.maps.LatLng(33.450701, 126.570667), // 지도의 중심좌표
        level: 3 // 지도의 확대 레벨
    };

var map = new kakao.maps.Map(mapContainer, mapOption); // 지도를 생성합니다

// 지도에 표시된 마커 객체를 가지고 있을 배열입니다
var markers = [];

// 1. 초기 기본 마커 생성 (첫 번째 코드의 마커도 배열에 넣어 함께 제어)
var markerPosition  = new kakao.maps.LatLng(33.450701, 126.570667); 
var marker = new kakao.maps.Marker({
    position: markerPosition
});
marker.setMap(map);
markers.push(marker); // 초기 마커도 '마커 감추기/보이기' 버튼으로 함께 제어되도록 배열에 추가

// 2. 지도를 클릭했을 때 클릭한 위치에 마커를 추가하는 이벤트 등록
kakao.maps.event.addListener(map, 'click', function(mouseEvent) {        
    addMarker(mouseEvent.latLng);             
});

// 마커를 생성하고 지도 위에 표시하며 배열에 담는 함수입니다
function addMarker(position) {
    var newMarker = new kakao.maps.Marker({
        position: position
    });

    newMarker.setMap(map);
    markers.push(newMarker);
}

// 배열에 추가된 모든 마커들을 지도에 표시하거나 숨기는 함수입니다
function setMarkers(map) {
    for (var i = 0; i < markers.length; i++) {
        markers[i].setMap(map);
    }            
}

// "마커 보이기" 버튼 클릭 시 실행
function showMarkers() {
    setMarkers(map);    
}

// "마커 감추기" 버튼 클릭 시 실행
function hideMarkers() {
    setMarkers(null);    
}
</script>
</body>
</html>
